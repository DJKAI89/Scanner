name: FRIDAY — Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🟢 Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🔍 Verify dist exists
        run: |
          echo "=== dist contents ==="
          ls -la dist/
          echo "=== dist/assets ==="
          ls -la dist/assets/
